<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="/app.js" defer></script>
    <link rel="stylesheet" href="./style.css">
    <script src="https://kit.fontawesome.com/8a3e67506d.js" crossorigin="anonymous"></script>
</head>
<body>
    <section id="landing">
        <nav>
            <figure>
                <img src="./assets/logo.png" alt="" class="personal-logo">
            </figure>
            <ul class="nav__link--list">
                <li class="nav__link"><a href="#" class="nav__link--anchor link__hover-effect link__hover-effect--black">About</a></li>
                <li class="nav__link"><a href="#" class="nav__link--anchor link__hover-effect link__hover-effect--black">Projects</a></li>
                <li class="nav__link"><a href="#" class="nav__link--anchor link__hover-effect link__hover-effect--black">Contact</a></li>
                <li class="nav__link"><i class="fas fa-adjust nav__link--anchor link__hover-effect link__hover-effect--black"></i></li>
            </ul>
        </nav>
        <header class="header">
            <div class="header__content">
                <h1 class="title">Hey</h1>
                <h1 class="title green">I'm Drew</h1>
                <p class="header__paragraph">I'm a <span class="green">Frontend Software Developer</span> with a strong passion for building web apps with great user experiences
                    <br>
                    Here's a bit <span class="green">about me.</span>
                </p>
                <div class="social__list">
                    <a href="#" class="social__link click">
                        <i class="fab fa-linkedin-in"></i>
                    </a>
                    <a href="https://github.com/xDrewCodes" target="_blank" class="social__link click">
                        <i class="fab fa-github"></i>
                    </a>
                    <a href="#" class="social__link click">
                        <i class="far fa-file-pdf"></i>
                    </a>
                </div>
            </div>
        </header>
        <button class="mail__button click">
            <i class="fas fa-envelope"></i>
        </button>
        <a href="#projects" class="scroll">
            <div class="scroll__icon click"></div>
        </a>
    </section>  
</body>
</html>
